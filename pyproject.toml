[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automation-finder"
version = "1.0.0"
description = "Finds repeated manual work in a business's activity data, estimates the hours, and drafts n8n workflows."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Samiul Huda" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
  "httpx>=0.27",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-python-dateutil"]

[project.scripts]
automation-finder = "automation_finder.cli:main"

[tool.setuptools.packages.find]
include = ["automation_finder*"]

[tool.setuptools.package-data]
automation_finder = ["templates/*", "web/static/*"]

[tool.ruff]
line-length = 118
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
